<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">AI Revenue OS vertical video thumbnail template, 9 by 16</title>
  <desc id="dsc">Vertical video thumbnail layout for Instagram Reels and YouTube Shorts on a near-black background with a lime accent bar along the top edge. The upper third holds a small uppercase lime label reading AI Revenue OS, a large white two-line headline placeholder, a grey supporting line, a cyan accent rule and a lime rounded duration badge. Below that is a dashed key-visual slot for a poster frame or diagram, sized to clear the right-hand action rail used by Reels and Shorts. Safe margin: keep text between 72 and 1008 pixels horizontally and between 300 and 1380 pixels vertically.</desc>

  <rect width="1080" height="1920" fill="#0b0d12"/>
  <rect x="0" y="0" width="1080" height="8" fill="#c7f36a"/>

  <!-- Brand rail -->
  <rect x="72" y="404" width="12" height="150" rx="6" fill="#c7f36a"/>

  <!-- Eyebrow -->
  <text x="124" y="372" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" font-weight="800" letter-spacing="6" fill="#c7f36a">AI REVENUE OS</text>

  <!-- Headline placeholder -->
  <text class="headline" x="120" y="496" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="92" font-weight="800" letter-spacing="-3" fill="#eef2f7">HEADLINE HERE</text>
  <text class="headline" x="120" y="608" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="92" font-weight="800" letter-spacing="-3" fill="#eef2f7">SECOND LINE</text>

  <!-- Supporting line -->
  <text x="124" y="684" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="36" font-weight="500" fill="#9ca8ba">One line that earns the click</text>

  <!-- Accent rule -->
  <rect x="124" y="722" width="120" height="8" rx="4" fill="#78e0d2"/>

  <!-- Duration badge -->
  <rect x="124" y="768" width="200" height="62" rx="31" fill="#c7f36a"/>
  <text x="224" y="810" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="34" font-weight="800" fill="#18200e">90 SEC</text>

  <!-- Key visual slot (clears the right-hand action rail) -->
  <rect x="72" y="870" width="784" height="510" rx="24" fill="#12161e" stroke="#556378" stroke-width="4" stroke-dasharray="18 14"/>
  <text x="464" y="1108" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="38" font-weight="700" fill="#9ca8ba">KEY VISUAL</text>
  <text x="464" y="1160" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" fill="#9ca8ba">poster frame or diagram</text>
  <rect x="264" y="1210" width="400" height="70" rx="35" fill="#181d27" stroke="#556378" stroke-width="3"/>
  <text x="464" y="1256" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="600" fill="#78e0d2">DROP IMAGE 9:16</text>
</svg>
