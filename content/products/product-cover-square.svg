<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">AI Revenue OS digital product cover template, square</title>
  <desc id="dsc">Square product cover on a near-black background with a lime rail across the top edge and a bordered panel inset from the edges. The panel holds a lime eyebrow reading PRODUCT and AI REVENUE OS, a large white two-line title placeholder reading PRODUCT TITLE and SECOND LINE, a cyan rule, a grey supporting line, a WHAT'S INSIDE label above three lime-bulleted module lines, and a lime badge reading STARTER KIT. The right side carries a decorative stack motif. Safe margin: keep text 72 pixels from every edge.</desc>

  <rect width="1200" height="1200" fill="#0b0d12"/>
  <rect x="0" y="0" width="1200" height="8" fill="#c7f36a"/>
  <rect x="72" y="72" width="1056" height="1056" rx="32" fill="#12161e" stroke="#556378" stroke-width="3"/>

  <!-- Decorative stack motif (no text, first-party geometry) -->
  <rect x="856" y="214" width="208" height="64" rx="12" fill="#181d27" stroke="#556378" stroke-width="3"/>
  <rect x="856" y="300" width="208" height="64" rx="12" fill="#181d27" stroke="#556378" stroke-width="3"/>
  <rect x="856" y="386" width="208" height="64" rx="12" fill="#181d27" stroke="#556378" stroke-width="3"/>

  <!-- Eyebrow -->
  <text x="120" y="176" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="800" letter-spacing="6" fill="#c7f36a">PRODUCT &#183; AI REVENUE OS</text>

  <!-- Title placeholder -->
  <text class="headline" x="116" y="296" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="78" font-weight="800" letter-spacing="-3" fill="#eef2f7">PRODUCT TITLE</text>
  <text class="headline" x="116" y="396" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="78" font-weight="800" letter-spacing="-3" fill="#eef2f7">SECOND LINE</text>

  <!-- Accent rule -->
  <rect x="120" y="436" width="140" height="8" rx="4" fill="#78e0d2"/>

  <!-- Supporting line -->
  <text x="120" y="506" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="32" font-weight="500" fill="#9ca8ba">One line that says what the buyer gets</text>

  <rect x="120" y="552" width="960" height="2" fill="#2a3342"/>

  <!-- Contents list -->
  <text x="120" y="620" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" font-weight="700" letter-spacing="4" fill="#78e0d2">WHAT'S INSIDE</text>

  <rect x="120" y="665" width="18" height="18" rx="4" fill="#c7f36a"/>
  <text x="158" y="684" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="500" fill="#eef2f7">Module 1 &#183; The offer, written on one page</text>

  <rect x="120" y="745" width="18" height="18" rx="4" fill="#c7f36a"/>
  <text x="158" y="764" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="500" fill="#eef2f7">Module 2 &#183; The outreach sequence that fills it</text>

  <rect x="120" y="825" width="18" height="18" rx="4" fill="#c7f36a"/>
  <text x="158" y="844" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="500" fill="#eef2f7">Bonus pack &#183; SOPs, checklists and swipe files</text>

  <!-- Kit badge -->
  <rect x="120" y="900" width="290" height="70" rx="35" fill="#c7f36a"/>
  <text x="265" y="946" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" font-weight="800" fill="#18200e">STARTER KIT</text>

  <!-- Footer -->
  <rect x="120" y="1040" width="960" height="2" fill="#2a3342"/>
  <text x="120" y="1090" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="600" fill="#9ca8ba">Saksham &#183; AI Revenue OS</text>
  <text x="1080" y="1090" text-anchor="end" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="600" fill="#9ca8ba">MM-01 template v1</text>
</svg>
